<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish - PUBG UC Shop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="form-page">
  <div class="card form-card">
    <h2 data-i18n="login_title">Tizimga kirish</h2>
    <div id="error-box" class="alert alert-error hidden"></div>
    <div class="field">
      <label data-i18n="login_email">Email</label>
      <input type="email" id="email">
    </div>
    <div class="field">
      <label data-i18n="login_password">Parol</label>
      <input type="password" id="password">
    </div>
    <button class="btn btn-primary btn-block" id="login-btn" data-i18n="login_btn">Kirish</button>
    <div class="form-footer-link">
      <span data-i18n="login_no_account">Hisobingiz yo'qmi?</span>
      <a href="/register.html" data-i18n="login_register_link">Ro'yxatdan o'tish</a>
    </div>
  </div>
</div>

<script src="/js/space-background.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
renderNavbar('login');

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('error-box');
  errBox.classList.add('hidden');
  try {
    await api('/auth/login', { method: 'POST', body: { email, password } });
    window.location.href = '/';
  } catch (e) {
    if (e.data && e.data.needVerification) {
      window.location.href = '/verify.html?email=' + encodeURIComponent(e.data.email);
      return;
    }
    errBox.textContent = e.message;
    errBox.classList.remove('hidden');
  }
});

document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});
</script>
</body>
</html>
