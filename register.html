<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ro'yxatdan o'tish - PUBG UC Shop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="form-page">
  <div class="card form-card">
    <h2 data-i18n="register_title">Ro'yxatdan o'tish</h2>
    <div id="error-box" class="alert alert-error hidden"></div>
    <div class="field">
      <label data-i18n="register_name">F.I.Sh</label>
      <input type="text" id="full_name">
    </div>
    <div class="field">
      <label data-i18n="register_email">Email</label>
      <input type="email" id="email">
    </div>
    <div class="field">
      <label data-i18n="register_password">Parol</label>
      <input type="password" id="password">
    </div>
    <button class="btn btn-primary btn-block" id="register-btn" data-i18n="register_btn">Ro'yxatdan o'tish</button>
    <div class="form-footer-link">
      <span data-i18n="register_have_account">Hisobingiz bormi?</span>
      <a href="/login.html" data-i18n="register_login_link">Kirish</a>
    </div>
  </div>
</div>

<script src="/js/space-background.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
renderNavbar('register');

document.getElementById('register-btn').addEventListener('click', async () => {
  const full_name = document.getElementById('full_name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('error-box');
  errBox.classList.add('hidden');
  try {
    const data = await api('/auth/register', { method: 'POST', body: { full_name, email, password } });
    window.location.href = '/verify.html?email=' + encodeURIComponent(data.email);
  } catch (e) {
    errBox.textContent = e.message;
    errBox.classList.remove('hidden');
  }
});
</script>
</body>
</html>
